<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Offline</title><meta name="theme-color" content="#07080a">
<style>
html,body{margin:0;height:100%;background:#07080a;color:#e9ebf1;font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
main{min-height:100%;display:grid;place-items:center;padding:24px 16px;text-align:center}
.dot{width:64px;height:64px;margin:0 auto 18px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff,#9aa3b8 45%,#2a2f3a 100%);box-shadow:0 0 24px rgba(200,210,240,.35)}
h1{font-size:22px;margin:0 0 8px}p{color:#8d95a9;margin:0 0 20px;max-width:340px}
button{font:inherit;font-weight:600;padding:12px 22px;border-radius:12px;border:0;background:#e10600;color:#fff}
</style></head>
<body><main><div><div class="dot"></div><h1>You're offline</h1><p>Your garage is safe. It will open again as soon as you have a connection.</p><button type="button" onclick="location.reload()">Try again</button></div></main></body></html>
